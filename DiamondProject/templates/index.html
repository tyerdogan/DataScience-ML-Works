<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diamond Price Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0f1a;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.10);
            --accent: #a78bfa;
            --accent2: #7c3aed;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.07);
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 48px 16px 64px;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 58, 237, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167, 139, 250, 0.10) 0%, transparent 60%);
        }

        /* ── Header ─────────────────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .diamond-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            filter: drop-shadow(0 0 18px rgba(167, 139, 250, 0.6));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e2e8f0 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* ── Card ────────────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 700px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* ── Section labels ──────────────────────────────────── */
        .section-label {
            font-size: 0.70rem;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
            margin-top: 28px;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        /* ── Grid ────────────────────────────────────────────── */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .grid-2 > .field,
        .grid-3 > .field {
            min-width: 0;
        }

        /* ── Form fields ─────────────────────────────────────── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.80rem;
            font-weight: 500;
            color: var(--muted);
        }

        input[type="number"],
        select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 0.92rem;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
        }

        input[type="number"]:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        input[type="number"]::placeholder {
            color: #475569;
        }

        /* custom select arrow */
        .select-wrap {
            position: relative;
            width: 100%;
        }

        .select-wrap::after {
            content: "▾";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: 0.85rem;
        }

        select option {
            background: #1e1b2e;
        }

        /* ── Divider ─────────────────────────────────────────── */
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0 0;
        }

        /* ── Button ──────────────────────────────────────────── */
        .btn-wrap {
            margin-top: 28px;
        }

        button#predict-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
        }

        button#predict-btn:hover {
            opacity: 0.90;
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.45);
        }

        button#predict-btn:active {
            transform: translateY(0);
        }

        button#predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Result ──────────────────────────────────────────── */
        #result {
            display: none;
            margin-top: 24px;
            border-radius: var(--radius);
            padding: 20px 24px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.25);
            text-align: center;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #result .result-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #result .price {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #error {
            display: none;
            margin-top: 16px;
            color: #f87171;
            font-size: 0.87rem;
            text-align: center;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: var(--radius);
            padding: 12px 16px;
            animation: fadeIn 0.3s ease;
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 540px) {
            .card {
                padding: 24px 18px;
            }

            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }

            .grid-3>.field:last-child {
                grid-column: span 2;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <span class="diamond-icon">💎</span>
        <h1>Diamond Price Predictor</h1>
        <p class="subtitle">Enter diamond characteristics to estimate its market price.</p>
    </header>

    <main class="card">

        <!-- QUALITY -->
        <p class="section-label">Quality</p>
        <div class="grid-3">
            <div class="field">
                <label for="cut">Cut</label>
                <div class="select-wrap">
                    <select id="cut">
                        <option value="">Select</option>
                        <option>Fair</option>
                        <option>Good</option>
                        <option>Very Good</option>
                        <option>Premium</option>
                        <option>Ideal</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="color">Color</label>
                <div class="select-wrap">
                    <select id="color">
                        <option value="">Select</option>
                        <option>D</option>
                        <option>E</option>
                        <option>F</option>
                        <option>G</option>
                        <option>H</option>
                        <option>I</option>
                        <option>J</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="clarity">Clarity</label>
                <div class="select-wrap">
                    <select id="clarity">
                        <option value="">Select</option>
                        <option>IF</option>
                        <option>VVS1</option>
                        <option>VVS2</option>
                        <option>VS1</option>
                        <option>VS2</option>
                        <option>SI1</option>
                        <option>SI2</option>
                        <option>I1</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- MEASUREMENTS -->
        <p class="section-label">Measurements</p>
        <div class="grid-3">
            <div class="field">
                <label for="x">Length — x (mm)</label>
                <input type="number" id="x" placeholder="e.g. 4.95" step="0.01" min="0" />
            </div>
            <div class="field">
                <label for="y">Width — y (mm)</label>
                <input type="number" id="y" placeholder="e.g. 4.98" step="0.01" min="0" />
            </div>
            <div class="field">
                <label for="z">Depth — z (mm)</label>
                <input type="number" id="z" placeholder="e.g. 3.07" step="0.01" min="0" />
            </div>
        </div>

        <!-- PROPORTIONS -->
        <p class="section-label">Proportions</p>
        <div class="grid-3">
            <div class="field">
                <label for="carat">Carat Weight</label>
                <input type="number" id="carat" placeholder="e.g. 0.50" step="0.01" min="0" />
            </div>
            <div class="field">
                <label for="depth">Depth %</label>
                <input type="number" id="depth" placeholder="e.g. 61.5" step="0.1" min="0" />
            </div>
            <div class="field">
                <label for="table">Table %</label>
                <input type="number" id="table" placeholder="e.g. 55.0" step="0.1" min="0" />
            </div>
        </div>

        <hr />

        <div class="btn-wrap">
            <button id="predict-btn" onclick="predict()">Predict Price</button>
        </div>

        <div id="result">
            <p class="result-label">Estimated Market Price</p>
            <p class="price" id="price-out"></p>
        </div>
        <div id="error"></div>

    </main>

    <script>
        async function predict() {
            const btn = document.getElementById('predict-btn');
            const resultEl = document.getElementById('result');
            const errorEl = document.getElementById('error');

            resultEl.style.display = 'none';
            errorEl.style.display = 'none';

            const fields = {
                carat: parseFloat(document.getElementById('carat').value),
                cut: document.getElementById('cut').value,
                color: document.getElementById('color').value,
                clarity: document.getElementById('clarity').value,
                depth: parseFloat(document.getElementById('depth').value),
                table: parseFloat(document.getElementById('table').value),
                x: parseFloat(document.getElementById('x').value),
                y: parseFloat(document.getElementById('y').value),
                z: parseFloat(document.getElementById('z').value),
            };

            // Basic validation
            for (const [key, val] of Object.entries(fields)) {
                if (val === '' || val === null || (typeof val === 'number' && isNaN(val))) {
                    showError(`Please fill in all fields. Missing: ${key}`);
                    return;
                }
            }

            btn.disabled = true;
            btn.textContent = 'Predicting…';

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fields),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `Server error (${res.status})`);
                }

                const data = await res.json();
                const price = data.predicted_price;

                document.getElementById('price-out').textContent =
                    '$' + price.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

                resultEl.style.display = 'block';

            } catch (e) {
                showError(e.message || 'Something went wrong. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Predict Price';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = '⚠️ ' + msg;
            el.style.display = 'block';
        }
    </script>
</body>

</html>
